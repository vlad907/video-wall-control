# Builds the mosaic engine and receiver with MSVC on Windows and runs their Direct3D 11 paths
# on WARP (Windows' software rasterizer; CI machines have no GPU). This checks
# that it compiles, that the HLSL compiles in D3DCompile, and that outputs map
# correctly pixel-for-pixel. It does not measure real GPU speed or test NDI.
name: mosaic-engine (Windows)

on:
  push:
    paths:
      - "mosaic-engine/**"
      - ".github/workflows/mosaic-engine-windows.yml"
  pull_request:
    paths:
      - "mosaic-engine/**"
      - ".github/workflows/mosaic-engine-windows.yml"
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mosaic-engine
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure (MSVC, no NDI SDK)
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build engine
        run: cmake --build build --config Release --parallel

      - name: Build editor
        working-directory: mosaic-engine/ui
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Pixel checks on Direct3D 11 (WARP)
        env:
          MOSAIC_SOFTWARE_GPU: "1"
        run: python tools/ci_check.py --engine build/Release/mosaic_engine.exe --out ci-out

      # Each check runs even if an earlier one failed, and reports its failed lines as annotations
      # on the run (readable without opening the log).
      - name: UYVY accuracy on Direct3D 11 (WARP)
        if: ${{ !cancelled() }}
        env:
          MOSAIC_SOFTWARE_GPU: "1"
        shell: pwsh
        run: |
          python -m pip install --quiet numpy
          $out = & python tools/check_uyvy.py build/Release/mosaic_engine.exe 2>&1
          $code = $LASTEXITCODE
          $out
          if ($code) { $out | Select-Object -Last 6 | ForEach-Object { "::error title=check_uyvy::$_" }; exit $code }

      - name: Receiver self-test (frame alignment, synthetic streams)
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $out = & build/Release/mosaic_receiver.exe --self-test 6 2>&1
          $code = $LASTEXITCODE
          $out
          if ($code) { $out | Select-String 'FAIL' | ForEach-Object { "::error title=receiver self-test::$($_.Line)" }; exit $code }

      - name: Audio self-test (delay, stalls, drift; simulated network)
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $out = & build/Release/mosaic_engine.exe --audio-self-test 2>&1
          $code = $LASTEXITCODE
          $out
          if ($code) { $out | Select-String 'FAIL' | ForEach-Object { "::error title=audio self-test::$($_.Line)" }; exit $code }

      # The real Direct3D 11 presenter on WARP: windows + flip-model swap chains + present loop.
      # Informational: CI machines may not have a desktop session to put windows on.
      - name: Receiver on Direct3D 11 (WARP), smoke test
        continue-on-error: true
        shell: pwsh
        run: |
          $cfg = '{"displays":[{"index":1,"stream":"synthetic","synthetic":{"width":320,"height":180},"window":{"x":0,"y":0,"w":640,"h":360}},{"index":2,"stream":"synthetic","synthetic":{"width":320,"height":180,"delayMs":5},"window":{"x":640,"y":0,"w":640,"h":360}}]}'
          Set-Content -Path rx.json -Value $cfg
          $p = Start-Process build/Release/mosaic_receiver.exe -ArgumentList "--software-gpu","--config","rx.json","--port","8095" -PassThru
          Start-Sleep -Seconds 6
          $s = Invoke-RestMethod http://127.0.0.1:8095/status
          $s | ConvertTo-Json -Depth 5
          Stop-Process -Id $p.Id
          if ($s.presenter -ne "Direct3D 11") { Write-Error "presenter is $($s.presenter)" }
          if ($s.spreadMax10s -gt 1) { Write-Error "displays out of step: $($s.spreadMax10s)" }

      # One stream cut across a 2 x 2 of windows, drawn by the real Direct3D 11 presenter: each
      # window's centre is read back and must be its quarter of the picture (red, green / blue, white).
      - name: Receiver on Direct3D 11 (WARP), one stream across a 2x2
        continue-on-error: true
        shell: pwsh
        run: |
          $d = @()
          foreach ($i in 0..3) {
            $d += @{ index = $i + 1; stream = "synthetic"; synthetic = @{ width = 320; height = 180; quadrants = $true }
                     window = @{ x = ($i % 2) * 640; y = [math]::Floor($i / 2) * 360; w = 640; h = 360 }
                     crop = @{ x = ($i % 2) * 0.5; y = [math]::Floor($i / 2) * 0.5; w = 0.5; h = 0.5 } }
          }
          @{ probe = $true; displays = $d } | ConvertTo-Json -Depth 5 | Set-Content -Path rx4.json
          $p = Start-Process build/Release/mosaic_receiver.exe -ArgumentList "--software-gpu","--config","rx4.json","--port","8096" -PassThru
          Start-Sleep -Seconds 6
          $s = Invoke-RestMethod http://127.0.0.1:8096/status
          Stop-Process -Id $p.Id
          $got = ($s.probe | ForEach-Object { "{0:X6}" -f $_ }) -join " "
          "presenter $($s.presenter), centres: $got"
          if ($s.presenter -ne "Direct3D 11") { "::warning title=receiver 2x2::not checked: presenter is $($s.presenter)"; exit 0 }
          if ($got -ne "FF0000 00FF00 0000FF FFFFFF") { "::error title=receiver 2x2::each window should show its quarter (FF0000 00FF00 0000FF FFFFFF), got $got"; exit 1 }

      - name: Upload snapshots and metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-warp-results
          path: mosaic-engine/ci-out
          if-no-files-found: warn
